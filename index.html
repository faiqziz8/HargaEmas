<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>

<script>
(function () {
  let th = "auto"; try { th = localStorage.getItem("emas.theme") || "auto"; } catch (e) {}
  const dark = th === "dark" || (th === "auto" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#14110b;--card:#1e1a12;--card2:#272116;--line:#3a3222;--text:#f3ecdc;--mute:#a99d84;
  --gold:#e3b341;--gold2:#f5d27a;--green:#3fb97a;--red:#e5604f;--amber:#e3a03a;--blue:#6aa7e8;
  --c-ubs:#e3b341;--c-antam:#f3ecdc;--c-world:#6aa7e8;--c-ma50:#3fb97a;--c-ma200:#e5604f;
  --grid:rgba(255,255,255,.06);--needle:#fff;--shade:rgba(0,0,0,.55);--onGold:#14110b;--bar:rgba(20,17,11,.92)}
[data-theme="light"]{
  --bg:#f6f2e9;--card:#fff;--card2:#f1ebdd;--line:#e3d9c4;--text:#2a2416;--mute:#7a6e57;
  --gold:#b8860b;--gold2:#8f6a0c;--green:#1f8a55;--red:#c2412f;--amber:#b06f10;--blue:#2f6fb5;
  --c-ubs:#c99412;--c-antam:#3b3326;--c-world:#2f6fb5;--c-ma50:#1f8a55;--c-ma200:#c2412f;
  --grid:rgba(0,0,0,.07);--needle:#2a2416;--shade:rgba(40,30,10,.35);--onGold:#fff;--bar:rgba(255,255,255,.94)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 86px);max-width:720px;margin:0 auto;transition:background .25s,color .25s}
h1{font-size:20px;letter-spacing:.2px}
h2{font-size:15px;color:var(--gold2);margin-bottom:10px;font-weight:650}
h3{font-size:14px;margin:12px 0 6px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:8px}
.sub{color:var(--mute);font-size:12.5px}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.btn.icon{font-size:17px;padding:5px 10px;line-height:1}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--onGold);font-weight:650}
.btn.full{width:100%;padding:10px}
.btn:active{opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.zone{display:inline-block;font-weight:800;font-size:12.5px;letter-spacing:1px;padding:4px 10px;border-radius:999px}
.z-BELI{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.z-CICIL{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.z-TUNGGU{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.z-MAHAL{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.big{font-size:22px;font-weight:750;margin:8px 0 4px}
.gauge{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--red) 0 35%,var(--blue) 35% 50%,var(--gold) 50% 70%,var(--green) 70% 100%);position:relative;margin:14px 0 4px;opacity:.85}
.needle{position:absolute;top:-5px;width:4px;height:20px;background:var(--needle);border-radius:3px;box-shadow:0 0 0 2px var(--bg);transition:left .6s}
.gl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute)}
.advice{margin-top:10px;font-size:14.5px}
.note{margin-top:8px;font-size:12.5px;color:var(--amber)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.pc.wide{grid-column:1/-1}
.pc .n{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.pc .v{font-size:19px;font-weight:720;margin-top:3px}
.pc .bb{font-size:12.5px;color:var(--mute);margin-top:2px}
.up{color:var(--green)}.dn{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:var(--card2);border:1px solid var(--line);color:var(--mute);border-radius:9px;padding:5px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.tab.on{color:var(--onGold);background:var(--gold);border-color:var(--gold);font-weight:650}
.chartbox{position:relative;height:270px}
.comp{margin:7px 0}.comp .row{display:flex;justify-content:space-between;font-size:13px}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
ul.r{padding-left:18px}ul.r li{margin:5px 0;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:right;padding:4px 0 6px}th:first-child{text-align:left}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;padding-left:8px}
.best{color:var(--green);font-weight:700}
details summary{cursor:pointer;color:var(--gold2);font-weight:600;font-size:14px}
details p,details li{font-size:13px;color:var(--mute);margin-top:6px}details ul{padding-left:18px}
label{font-size:12.5px;color:var(--mute);display:block;margin-bottom:3px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px;font-size:15px;font-family:inherit}
textarea{font-size:12px;min-height:90px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f2+.f2{margin-top:10px}
.res{margin-top:10px;font-size:14px}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.foot{text-align:center;color:var(--mute);font-size:11.5px;margin-top:14px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle}
.err{background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);color:var(--red);border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px;display:none}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--card2);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:17px;margin-top:2px}.kpi span{font-size:11.5px;color:var(--mute)}
.ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.ev .dt{min-width:52px;text-align:center;background:var(--card2);border-radius:10px;padding:5px 4px;font-size:11px;color:var(--mute)}
.ev .dt b{display:block;font-size:18px;color:var(--text)}
.ev .tx{flex:1;font-size:13.5px}.ev .tx small{display:block;color:var(--mute);font-size:12px}
.ev .cd{font-size:12px;color:var(--gold2);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.del{background:none;border:0;color:var(--mute);font-size:16px;cursor:pointer;padding:0 0 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--text);font-size:14px;padding:8px 4px;border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--gold);color:var(--onGold);font-weight:650}
.set{margin-bottom:14px}.set .lbl{font-size:13px;color:var(--mute);margin-bottom:7px}
.view{display:none;animation:fade .2s}.view.on{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:15}
.tabbar .in{display:flex;width:100%;max-width:720px}
.tabbar button{flex:1;background:none;border:0;color:var(--mute);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;font-family:inherit}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--gold)}
/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--card);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:21;max-height:90vh;overflow:auto}
.sheetOpen .shade{opacity:1;pointer-events:auto}.sheetOpen .sheet{transform:none;visibility:visible;transition:transform .25s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
/* splash & pull */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;transition:opacity .35s}
#splash img{width:84px;height:84px;border-radius:20px}#splash.hide{opacity:0;pointer-events:none}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translate(-50%,-60px);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;z-index:16;transition:transform .2s}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.offline{display:none;background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber);border-radius:10px;padding:7px 10px;font-size:12.5px;margin-bottom:10px}
</style>
</head>
<body>
<div id="splash"><img src="apple-touch-icon.png" alt=""><div class="sub" id="splashTx">Monitor Harga Emas</div></div>
<div id="ptr">↻</div>

<div class="top">
  <div><h1 id="hTitle">🪙 Monitor Harga Emas</h1><div class="sub" id="upd">…</div></div>
  <button class="btn icon" id="reload" aria-label="Reload">↻</button>
</div>
<div class="offline" id="offline"></div>
<div class="err" id="err"></div>

<section class="view" id="v-home"></section>
<section class="view" id="v-analisa"></section>
<section class="view" id="v-porto"></section>
<section class="view" id="v-alat"></section>
<section class="view" id="v-more"></section>

<nav class="tabbar"><div class="in" id="tabbar"></div></nav>

<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
const VERSION = "1.6.0", YEAR = 2026;
let DATA = null, chart = null, range = 90, simBrand = "ubs", VIEW = "home", fromCache = false;
const series = { ubs: true, antam: true, world: true, ma: false };
const store = { get: (k, d) => { try { const v = localStorage.getItem("emas." + k); return v == null ? d : v; } catch (e) { return d; } },
                set: (k, v) => { try { localStorage.setItem("emas." + k, v); } catch (e) {} } };
let LANG = store.get("lang", "id"), THEME = store.get("theme", "auto");
const L = (id, en) => LANG === "en" ? en : id;
const LOC = () => LANG === "en" ? "en-US" : "id-ID";
const $ = id => document.getElementById(id);
const R = v => v == null || isNaN(v) ? "—" : (v < 0 ? "-" : "") + "Rp" + Math.round(Math.abs(v)).toLocaleString(LOC());
const P = (v, d = 1) => v == null || isNaN(v) ? "—" : (v * 100).toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const SP = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : "") + P(v, d);
const N = (v, d = 1) => v == null ? "—" : Number(v).toLocaleString(LOC(), { maximumFractionDigits: d });
const fmtD = d => new Date(d + "T00:00:00").toLocaleDateString(LOC(), { day: "numeric", month: "short", year: "2-digit" });
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ====== konstanta ====== */
const ZL = z => ({ BELI: L("BELI", "BUY"), CICIL: L("CICIL", "ACCUMULATE"), TUNGGU: L("TUNGGU", "WAIT"), MAHAL: L("MAHAL", "EXPENSIVE") }[z] || z);
const ZC = { B: "BELI", C: "CICIL", T: "TUNGGU", M: "MAHAL" };
const BRANDS = { antam: "Antam", ubs: "UBS", g24: "Galeri24" };
const ANTAM_ANCHORS = [["2019-08-16", 766000], ["2021-09-09", 930000], ["2023-06-29", 1052000], ["2024-07-05", 1380000],
  ["2025-08-22", 1916000], ["2026-01-05", 2515000], ["2026-01-29", 3168000], ["2026-06-04", 2759000], ["2026-07-21", 2601000], ["2026-09-11", 2600000]];
// Jadwal resmi: The Fed (federalreserve.gov, revisi 12 Nov 2026) & BLS CPI. Waktu sudah dikonversi ke WIB.
const EVENTS = [
  ["2026-12-10T02:00", "fomc"], ["2026-12-10T20:30", "cpi", "Nov 2026"],
  ["2027-01-13T20:30", "cpi", "Des 2026|Dec 2026"], ["2027-01-28T02:00", "fomc"],
  ["2027-02-11T20:30", "cpi", "Jan 2027"], ["2027-03-10T20:30", "cpi", "Feb 2027"], ["2027-03-18T01:00", "fomc"],
  ["2027-04-13T19:30", "cpi", "Mar 2027"], ["2027-04-29T01:00", "fomc"], ["2027-05-12T19:30", "cpi", "Apr 2027"],
  ["2027-06-10T01:00", "fomc"], ["2027-06-10T19:30", "cpi", "Mei 2027|May 2027"], ["2027-07-14T19:30", "cpi", "Jun 2027"],
  ["2027-07-29T01:00", "fomc"], ["2027-08-11T19:30", "cpi", "Jul 2027"], ["2027-09-14T19:30", "cpi", "Agu 2027|Aug 2027"],
  ["2027-09-16T01:00", "fomc"], ["2027-10-14T19:30", "cpi", "Sep 2027"], ["2027-10-27T00:00", "strat"],
  ["2027-11-10T20:30", "cpi", "Okt 2027|Oct 2027"], ["2027-11-18T02:00", "fomc"], ["2027-12-10T20:30", "cpi", "Nov 2027"],
  ["2028-01-27T02:00", "fomc"]];

/* ====== navigasi ====== */
const TABS = [
  ["home", () => L("Beranda", "Home"), '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'],
  ["analisa", () => L("Analisa", "Analysis"), '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ["porto", () => L("Portofolio", "Portfolio"), '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 13h18"/>'],
  ["alat", () => L("Alat", "Tools"), '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>'],
  ["more", () => L("Lainnya", "More"), '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>']];
function buildTabbar() {
  $("tabbar").innerHTML = TABS.map(([k, n, ic]) => `<button data-v="${k}" class="${k === VIEW ? "on" : ""}"><svg viewBox="0 0 24 24">${ic}</svg>${n()}</button>`).join("");
}
$("tabbar").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.v); };
function go(v, push = true) {
  if (!TABS.some(t => t[0] === v)) v = "home";
  VIEW = v; document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  [...$("tabbar").children].forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (push && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  window.scrollTo(0, 0);
  renderView(v);
}
window.addEventListener("hashchange", () => go(location.hash.slice(1), false));

/* ====== tema & bahasa ====== */
function applyTheme() {
  const dark = THEME === "dark" || (THEME === "auto" && !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("themeColor").setAttribute("content", dark ? "#14110b" : "#f6f2e9");
  if (DATA && VIEW === "home") drawChart();
}
function applyLang() {
  document.documentElement.lang = LANG; document.title = L("Monitor Harga Emas", "Gold Price Monitor");
  $("hTitle").textContent = "🪙 " + document.title; $("splashTx").textContent = document.title;
  buildTabbar(); renderAll();
}
if (window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => THEME === "auto" && applyTheme());

/* ====== data ====== */
async function load(quiet) {
  $("err").style.display = "none";
  try {
    const r = await fetch("prices.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json(); fromCache = r.headers.get("x-from-cache") === "1";
    renderAll(); liveSpot();
  } catch (e) {
    if (!DATA) { $("upd").textContent = L("Belum ada data", "No data yet"); $("err").style.display = "block";
      $("err").innerHTML = L(`Data belum tersedia (${e.message}). Jalankan robot: repo GitHub → <b>Actions</b> → <b>Update harga emas</b> → <b>Run workflow</b>.`,
        `Data not available (${e.message}). Run the robot: GitHub repo → <b>Actions</b> → <b>Update harga emas</b> → <b>Run workflow</b>.`); }
  }
  $("splash").classList.add("hide");
}
function lastDom() { const D = DATA?.domestic || []; return D[D.length - 1] || {}; }
function lastBy(key) { const D = DATA?.domestic || []; for (let i = D.length - 1; i >= 0; i--) if (D[i][key]) return D[i]; return {}; }
function chgEl(now, prev) {
  if (now == null || prev == null) return "";
  const d = now - prev; return `<span class="${d > 0 ? "up" : d < 0 ? "dn" : ""}">${d > 0 ? "▲" : d < 0 ? "▼" : "•"} ${P(Math.abs(d / prev), 2)}</span>`;
}
function renderAll() {
  if (DATA) {
    const up = new Date(DATA.updated);
    $("upd").textContent = L("Diperbarui ", "Updated ") + up.toLocaleString(LOC(), { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + " WIB";
    const off = !navigator.onLine || fromCache;
    $("offline").style.display = off ? "block" : "none";
    $("offline").textContent = L("Offline — menampilkan data terakhir yang tersimpan.", "Offline — showing the last saved data.");
  }
  renderView(VIEW);
}
function renderView(v) {
  ({ home: vHome, analisa: vAnalisa, porto: vPorto, alat: vAlat, more: vMore })[v]();
}

/* ====== analisa helpers ====== */
const RTXT = {

const toT = d => new Date(d + "T00:00:00Z").getTime();
function antamSeries() {
  const W = DATA.world || [], D = DATA.domestic || [], H = DATA.antam_hist || [];
  const real = {}; H.forEach(x => real[x.d] = x.jual); D.forEach(x => { if (x.antam_jual) real[x.d] = x.antam_jual; });
  const firstReal = Object.keys(real).sort()[0] || "9999";
  const daily = W.filter(x => !x.m), wd = daily.length > 200 ? daily : W;
  const near = d => { let b = null; for (const x of wd) { if (x.d <= d) b = x; else break; } return b; };
  const pts = [];
  const lastReal = Object.keys(real).sort().slice(-1).map(d => [d, real[d]]);
  for (const [d, v] of [...ANTAM_ANCHORS, ...lastReal]) { const w = near(d); if (w && (toT(d) - toT(w.d)) < 35 * 864e5) pts.push([toT(d), v / w.idr_g]); }
  pts.sort((a, b) => a[0] - b[0]);
  const prem = tt => { if (!pts.length) return null; if (tt <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (tt <= pts[i][0]) { const [t0, p0] = pts[i - 1], [t1, p1] = pts[i]; return p0 + (p1 - p0) * (tt - t0) / (t1 - t0); }
    return pts[pts.length - 1][1]; };
  const out = {};
  for (const x of W) if (x.d < firstReal) { const p = prem(toT(x.d)); if (p) out[x.d] = Math.round(x.idr_g * p / 1000) * 1000; }
  Object.assign(out, real);
  return { map: out, firstReal };
}
function maSeries(vals, n) { const o = []; let s = 0; for (let i = 0; i < vals.length; i++) { s += vals[i]; if (i >= n) s -= vals[i - n]; o.push(i >= n - 1 ? s / n : null); } return o; }

function dca() {
  const M = parseFloat($("dM").value) || 0, Y = +$("dY").value;
  const AS = antamSeries(), dates = Object.keys(AS.map).sort();
  const bbNow = lastBy("antam_bb").antam_bb, jNow = lastBy("antam_jual").antam_jual;
  if (!dates.length || !bbNow || !M) { $("dRes").textContent = L("Data belum cukup.", "Not enough data."); return; }
  const start = new Date(); start.setFullYear(start.getFullYear() - Y); const sS = start.toISOString().slice(0, 7);
  const months = []; const seen = new Set();
  for (const d of dates) { const ym = d.slice(0, 7); if (ym >= sS && !seen.has(ym)) { seen.add(ym); months.push([d, AS.map[d]]); } }
  if (months.length < 2) { $("dRes").textContent = L("Data belum cukup.", "Not enough data."); return; }
  const n = months.length, total = M * n;
  // 1) DCA rutin
  let g1 = 0; months.forEach(([, p]) => g1 += M / p);
  // 2) sekaligus di awal
  const g2 = total / months[0][1];
  // 3) DCA + sinyal: tabung tiap bulan, beli saat zona BELI/CICIL
  const zm = {}; (DATA.backtest?.monthly || []).forEach(([d, z]) => zm[d.slice(0, 7)] = z);
  let g3 = 0, cash = 0, hasZ = Object.keys(zm).length > 0;
  months.forEach(([d, p]) => { cash += M; const z = zm[d.slice(0, 7)]; if (z === "B" || z === "C") { g3 += cash / p; cash = 0; } });
  // 4) ikuti aturan aplikasi (porsi per zona, sisa ke cadangan, cadangan dipakai saat BELI)
  let g4 = 0, cad = 0;
  months.forEach(([d, p]) => { const z = zm[d.slice(0, 7)];
    if (z === "B") { g4 += (M + cad) / p; cad = 0; } else { const f = RULE_Z[z] ?? 1; g4 += M * f / p; cad += M * (1 - f); } });
  const val = g => g * bbNow;
  const rows = [[L("Beli rutin tiap bulan (DCA)", "Monthly DCA"), g1, 0], [L("Sekaligus di awal", "Lump sum at start"), g2, 0]];
  if (hasZ) { rows.push([L("Tabung & beli hanya saat sinyal BELI/CICIL", "Save & buy only on BUY/ACCUMULATE"), g3, cash]);
    rows.push(["⭐ " + L("Ikuti aturan aplikasi (Rencana beli)", "Follow the app's rule (Buying plan)"), g4, cad]); }
  const best = Math.max(...rows.map(r => val(r[1]) + r[2]));
  $("dRes").innerHTML = `<div class="sub">${L(`${n} bulan × ${R(M)} = total ${R(total)}. Dinilai dengan buyback Antam hari ini (${R(bbNow)}/g).`, `${n} months × ${R(M)} = ${R(total)} total. Valued at today's Antam buyback (${R(bbNow)}/g).`)}</div>
    <table style="margin-top:6px"><tr><th>${L("Strategi", "Strategy")}</th><th>Gram</th><th>${L("Nilai akhir", "End value")}</th><th>${L("Hasil", "Return")}</th></tr>
    ${rows.map(([nm, g, c]) => { const v = val(g) + c; return `<tr><td>${nm}${c ? `<br><span class="sub">${L("+ sisa tunai ", "+ cash left ")}${R(c)}</span>` : ""}</td><td>${N(g, 2)}</td><td class="${v === best ? "best" : ""}">${R(v)}</td><td class="${v >= total ? "up" : "dn"}">${SP(v / total - 1)}</td></tr>`; }).join("")}</table>
    <div class="sub" style="margin-top:8px">${L("Harga beli memakai harga Antam (asli bila tersedia, sebelumnya estimasi). Hasil masa lalu tidak menjamin hasil masa depan.", "Buy prices use Antam prices (real where available, estimated before). Past results don't guarantee future returns.")}</div>`;
}

    <div class="set"><div class="lbl">${L("Tampilan", "Appearance")}</div><div class="seg" id="segTheme"><button data-v="auto">${L("Otomatis", "Auto")}</button><button data-v="dark">${L("Gelap", "Dark")}</button><button data-v="light">${L("Terang", "Light")}</button></div></div></div>
  <div class="card"><details><summary>${L("Notifikasi", "Notifications")}</summary>
    <p>${L("Notifikasi dikirim lewat aplikasi ntfy saat rekomendasi menjadi BELI, lalu diingatkan tiap pagi selama masih BELI, dan saat harga menyentuh target (jika diatur di Variables repo: TARGET_UBS / TARGET_ANTAM).",
      "Alerts are sent via the ntfy app when the recommendation turns BUY, every morning while it stays BUY, and when prices hit a target (set TARGET_UBS / TARGET_ANTAM in repo Variables).")}</p></details></div>
  <div class="card"><details><summary>${L("Cara kerja skor", "How the score works")}</summary>
    <p>${L("Skor 0–100 dihitung dari harga dunia (Rp/gram): harga vs rata-rata 200 hari (25), RSI 14 hari (20), posisi di rentang 1 tahun (20), koreksi dari puncak (15), momentum (10), premi UBS (10). Jika harga masih anjlok tajam, skor dibatasi maksimal 69.",
      "Score 0–100 from world price (Rp/gram): price vs 200-day avg (25), 14-day RSI (20), position in 1-year range (20), drawdown from high (15), momentum (10), UBS premium (10). If price is still dropping sharply, the score is capped at 69.")}</p>
    <p>${L("Zona: ≥70 BELI · 50–69 CICIL · 35–49 TUNGGU · <35 MAHAL. Data diperbarui otomatis ±10.00 & 16.00 WIB. Bukan nasihat keuangan; tidak bisa memperkirakan berita mendadak.",
      "Zones: ≥70 BUY · 50–69 ACCUMULATE · 35–49 WAIT · <35 EXPENSIVE. Updated ~10:00 & 16:00 WIB. Not financial advice; can't anticipate sudden news.")}</p></details></div>
  <div class="card"><details><summary>${L("Status sumber data", "Data source status")}</summary>
    <table style="margin-top:6px">${Object.keys(s).map(k => `<tr><td>${esc(k)}</td><td style="word-break:break-word">${esc(s[k])}</td></tr>`).join("")}
    <tr><td>${L("Versi robot", "Robot version")}</td><td>${DATA?.version || "—"}</td></tr><tr><td>${L("Versi aplikasi", "App version")}</td><td>${VERSION}</td></tr></table></details></div>
  <div class="card"><h2>${L("Tentang", "About")}</h2><div class="sub" style="line-height:1.7">${L("Monitor Harga Emas", "Gold Price Monitor")} v${VERSION}<br>
    ${L("Data", "Data")}: Galeri24/Pegadaian, Bundesbank/LBMA, ECB, FRED, gold-api.com · ${L("Kalender", "Calendar")}: Federal Reserve, BLS<br>${L("Bukan nasihat keuangan.", "Not financial advice.")}<br>© ${YEAR} Faiq Aziz</div></div>`;
  const seg = (id, v) => [...$(id).children].forEach(b => b.classList.toggle("on", b.dataset.v === v));
  seg("segLang", LANG); seg("segTheme", THEME);
  $("segLang").onclick = e => { const b = e.target.closest("button"); if (!b) return; LANG = b.dataset.v; store.set("lang", LANG); applyLang(); };
  $("segTheme").onclick = e => { const b = e.target.closest("button"); if (!b) return; THEME = b.dataset.v; store.set("theme", THEME); seg("segTheme", THEME); applyTheme(); };
}

/* ====== sheet ====== */
function openSheet(html) { $("sheet").innerHTML = `<div class="grab"></div>` + html; document.body.classList.add("sheetOpen"); const c = $("shClose"); if (c) c.onclick = closeSheet; }
function closeSheet() { document.body.classList.remove("sheetOpen"); }
$("shade").onclick = closeSheet;

/* ====== tarik untuk refresh ====== */
let py = null, pd = 0;
window.addEventListener("touchstart", e => { py = window.scrollY <= 0 && !document.body.classList.contains("sheetOpen") ? e.touches[0].clientY : null; pd = 0; }, { passive: true });
window.addEventListener("touchmove", e => { if (py == null) return; pd = e.touches[0].clientY - py; if (pd > 0) $("ptr").style.transform = `translate(-50%,${Math.min(pd, 90) - 60}px)`; }, { passive: true });
window.addEventListener("touchend", async () => { if (py == null) return; py = null;
  if (pd > 75) { $("ptr").innerHTML = '<span class="spin">↻</span> ' + L("Memuat…", "Loading…"); $("ptr").style.transform = "translate(-50%,20px)"; await load(); }
  $("ptr").style.transform = "translate(-50%,-60px)"; setTimeout(() => $("ptr").textContent = "↻", 250); });

$("reload").onclick = () => load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && DATA) load(); });
window.addEventListener("online", () => load()); window.addEventListener("offline", renderAll);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

applyTheme(); buildTabbar(); go(location.hash.slice(1) || "home", false); applyLang(); load();
setTimeout(() => $("splash").classList.add("hide"), 2500);
</script>
</body>
</html>
